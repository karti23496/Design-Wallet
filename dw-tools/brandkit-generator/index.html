<body class="dw-tool-page bk-page">
    <div class="page-shell">
        <header class="site-header"></header>

        <main class="bk-main" id="bk-app" data-phase="idle">
            <section class="bk-hero">
                <a href="/" class="tool-back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M5 12L12 19M5 12L12 5"/></svg>

                <h1 class="tool-title">Website Brandkit Generator</h1>
                <p class="tool-intro">Drop the website link here. This tool will fetch the colors and typographies.</p>
            </section>

            <section class="bk-card" aria-label="Brandkit">
                <div class="bk-col">
                    <form class="bk-form" id="bk-form" novalidate>
                        <label class="bk-visually-hidden" for="bk-url">Website link</label>
                        <input
                            type="text"
                            id="bk-url"
                            class="bk-input"
                            placeholder="www.designwallet.in"
                            inputmode="url"
                            autocomplete="off"
                            autocapitalize="off"
                            spellcheck="false"
                        >
                        <button type="submit" class="bk-go" id="bk-go" aria-label="Generate brandkit">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12h14M13 6l6 6-6 6"/>
                            </svg>
                        </button>
                    </form>

                    <p class="bk-error" id="bk-error" role="alert" hidden></p>

                    <section class="bk-section" aria-labelledby="bk-palette-title">
                        <div class="bk-section-head">
                            <h2 class="bk-section-title" id="bk-palette-title">Color Palette</h2>
                            <button type="button" class="bk-download" id="bk-download" disabled>
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/>
                                </svg>
                                <span>Download brandkit</span>
                            </button>
                        </div>
                        <div class="bk-palette" id="bk-palette">
                            <div class="bk-placeholder bk-placeholder--palette"></div>
                        </div>
                    </section>

                    <section class="bk-section" aria-labelledby="bk-type-title">
                        <h2 class="bk-section-title" id="bk-type-title">Typographies</h2>
                        <div class="bk-type" id="bk-type">
                            <div class="bk-placeholder bk-placeholder--type"></div>
                        </div>
                    </section>
                </div>

                <aside class="bk-preview" aria-label="Website preview">
                    <div class="bk-preview-frame" id="bk-preview">
                        <p class="bk-empty bk-empty--preview" id="bk-preview-empty">A preview of the site appears here.</p>
                        <img id="bk-shot" alt="" width="1200" height="1228" hidden>
                    </div>
                    <button type="button" class="bk-scroll-cue" id="bk-scroll-cue" aria-label="Scroll the preview down" hidden>

                    <div class="bk-assets" id="bk-assets">
                        <div class="bk-placeholder bk-placeholder--assets"></div>
