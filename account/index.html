<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your account — Design Wallet™</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700;800;900&family=Geist+Mono:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/Logo/favicon-img/icon32.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/account/account.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header"></header>

        <main class="auth-shell auth-shell--dashboard">
            <div class="auth-card" data-dash-card hidden>
                <h1 class="auth-title">Your account</h1>

                <div class="dash-row">
                    <span class="dash-label">Email</span>
                    <span class="dash-value" data-dash-email>—</span>
                </div>

                <div class="dash-row">
                    <span class="dash-label">Subscription</span>
                    <span class="dash-status" data-dash-status>—</span>
                </div>

                <div class="dash-row" data-dash-renews-row hidden>
                    <span class="dash-label" data-dash-renews-label>Renews</span>
                    <span class="dash-value" data-dash-renews>—</span>
                </div>

                <!-- Active subscriber -->
                <div class="dash-active" data-dash-active hidden>
                    <a class="primary-button dash-cta" href="/category/">Open the collection</a>
                    <p class="dash-manage">
                        <a href="#" data-dash-portal target="_blank" rel="noopener noreferrer">
                            Manage subscription or update your card
                        </a>
                    </p>
                </div>

                <!-- Suspended (payment_failed | cancelled_and_expired) -->
                <div class="dash-suspended" data-dash-suspended hidden>
                    <p class="dash-suspended-copy" data-dash-suspended-copy></p>
                    <a class="primary-button dash-cta" data-dash-suspended-cta href="#"></a>
                </div>

                <!-- Change password -->
                <details class="dash-pw">
                    <summary>Change password</summary>
                    <form class="auth-form" data-dash-pw-form>
                        <label class="auth-field">
                            <span>New password</span>
                            <input type="password" data-dash-pw autocomplete="new-password"
                                   placeholder="••••••••" required>
                        </label>
                        <p class="auth-error" data-dash-pw-error hidden></p>
                        <button type="submit" class="primary-button auth-submit">Update password</button>
                    </form>
                </details>

                <div class="auth-links">
                    <button type="button" class="auth-link" data-dash-logout>Log out</button>
                </div>
            </div>

            <div class="auth-card auth-card--loading" data-dash-loading>
                <p class="dash-loading">Loading your account…</p>
            </div>
        </main>

        <footer class="site-footer"></footer>
    </div>

    <script src="/header.js?v=20260712-1"></script>
    <script src="/footer.js?v=20260712-1"></script>
    <script src="/auth/config.js"></script>
    <script type="module" src="/auth/supabase-client.js"></script>
    <script type="module" src="/account/account.js"></script>
</body>
</html>
