<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HLX9Y7DQV7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HLX9Y7DQV7');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Design Wallet™</title>
    <meta name="description" content="Log in to Design Wallet to access your collection.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700;800;900&family=Geist+Mono:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/Logo/favicon-img/icon32.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/account/account.css">
</head>
<body>
    <main class="auth-shell">
        <a class="auth-brand" href="/" aria-label="Design Wallet home">
            <img src="/public/Logo/Website-logo.svg" alt="Design Wallet">
        </a>

        <div class="auth-card" data-auth-card>
            <!-- Heading + intro adapt to the detected mode -->
            <h1 class="auth-title" data-auth-title>Log in to Design Wallet</h1>
            <p class="auth-intro" data-auth-intro>Enter your email and password to access your collection.</p>

            <div class="auth-banner" data-auth-banner hidden></div>

            <form class="auth-form" data-auth-form novalidate>
                <label class="auth-field">
                    <span>Email</span>
                    <input type="email" name="email" data-auth-email autocomplete="email"
                           placeholder="you@example.com" required>
                </label>

                <label class="auth-field" data-auth-password-field>
                    <span data-auth-password-label>Password</span>
                    <input type="password" name="password" data-auth-password
                           autocomplete="current-password" placeholder="••••••••" required>
                </label>

                <p class="auth-error" data-auth-error hidden></p>

                <button type="submit" class="primary-button auth-submit" data-auth-submit>
                    Log in
                </button>
            </form>

            <div class="auth-divider" data-auth-google-divider><span>or</span></div>

            <button type="button" class="auth-google" data-auth-google>
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
                </svg>
                Sign in with Google
            </button>

            <div class="auth-links">
                <button type="button" class="auth-link" data-auth-forgot>Forgot password?</button>
            </div>

            <p class="auth-foot">
                Don't have an account? <a href="/pricing/">Subscribe to login</a>
            </p>
        </div>
    </main>

    <script src="/auth/config.js"></script>
    <script type="module" src="/auth/supabase-client.js"></script>
    <script type="module" src="/account/login/login.js"></script>
</body>
</html>
